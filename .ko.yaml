# ko builds the operator image: https://ko.build/configuration/
# Chainguard's static image: minimal, non-root (uid 65532), multi-arch.
# Pinned by digest; Dependabot does not track this, so bump it deliberately.
defaultBaseImage: cgr.dev/chainguard/static:latest@sha256:9e2306b457ff71ce370043dc68c7b52bb1e6622c1c6c6714edbed57496f3116e
defaultPlatforms:
  - linux/amd64
  - linux/arm64
builds:
  - id: manager
    main: ./cmd
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
