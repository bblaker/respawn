                    description: retention controls which scheduled snapshots are
                      kept.
                    properties:
                      keepDaily:
                        description: keepDaily keeps the most recent snapshot for
                          each of the last N days.
                        format: int32
                        minimum: 0
                        type: integer
                      keepLast:
                        description: keepLast keeps the most recent N snapshots.
                        format: int32
                        minimum: 0
                        type: integer
                      keepMonthly:
                        description: keepMonthly keeps the most recent snapshot for
                          each of the last N months.
                        format: int32
                        minimum: 0
                        type: integer
                      keepWeekly:
                        description: keepWeekly keeps the most recent snapshot for
                          each of the last N weeks.
