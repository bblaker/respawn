name: E2E

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: E2E on k3d
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile', '.custom-gcl.yml', 'go.mod') }}
      - run: make test-e2e
      - name: Collect cluster state
        if: failure()
        run: |
          mkdir -p e2e-artifacts
          kubectl get all,events -A -o wide > e2e-artifacts/resources.txt 2>&1 || true
          kubectl get gameservers,gameserverbackups,backuprepositories -A -o yaml > e2e-artifacts/respawn.yaml 2>&1 || true
          kubectl -n respawn-system logs deployment/respawn-controller-manager --all-containers > e2e-artifacts/manager.log 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-artifacts
          path: e2e-artifacts
          retention-days: 7
